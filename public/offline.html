<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#fff9f0">
    <title>Bali Hub 2026 · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#fff9f0,#eaf8f5);font-family:Arial,"Helvetica Neue",sans-serif;color:#073b44;text-align:center}.card{width:min(440px,100%);padding:38px 28px;border:1px solid #cfe4e1;border-radius:26px;background:#fff;box-shadow:0 20px 55px rgba(7,59,68,.13)}img{width:84px;height:84px;border-radius:20px}p{color:#60787c;line-height:1.6}button{min-height:50px;border:0;border-radius:12px;padding:0 22px;background:#ff6238;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="">
      <h1>You’re offline.</h1>
      <p>Reconnect to view current trip updates, chats, photos and the latest Bali Hub information.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
